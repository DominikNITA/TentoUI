name: Deploy TentoUI Docs to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM Docs
        run: |
          dotnet publish src/TentoUI.Docs/TentoUI.Docs.csproj -c Release -o output/wwwroot

      - name: Configure for GitHub Pages (NoJekyll and Base Path)
        run: |
          # Prevent GitHub Pages from ignoring files beginning with underscore (_framework, _content)
          touch output/wwwroot/wwwroot/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wwwroot/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
